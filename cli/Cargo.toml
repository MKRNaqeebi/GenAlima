[package]
name = "genalima-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Command-line client for GenAlima typed Python workflows"
license = "MIT"
publish = false

[[bin]]
name = "genalima"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
# NOTE: serde_json's `preserve_order` feature must stay OFF. With it, object keys
# keep insertion order instead of sorting, which would break the byte-stable
# canonical workflow.json in docs/cli-plan.md §5.2.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2.12", features = ["json"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
rpassword = "7"
dirs = "5"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
